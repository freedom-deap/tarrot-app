<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="小アルカナで遊ぶ1対1のポーカー">
    <title>タロット・ポーカー</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./games.css">
  </head>
  <body>
    <main class="app-shell game-page">
      <header class="app-header">
        <p class="eyebrow">Tarot card games</p>
        <h1>1対1 ポーカー</h1>
        <p>小アルカナ56枚と、毎回ランダムに選ぶ大アルカナ2枚でCPUと対戦します。</p>
        <a class="back-link" href="./index.html">TOPへ戻る</a>
      </header>
      <section class="game-rules" aria-labelledby="rules-heading">
        <h2 id="rules-heading">ルール</h2>
        <p>5枚を配り、手札を最大3枚まで選んで1回交換します。交換しない場合も勝負できます。CPUも1回交換します。大アルカナ2枚は、好きなスート・ランクに代わるジョーカーです。</p>
        <p>ランクは 2～10、ペイジ、ナイト、クイーン、キング、エースの順。エースは A・2・3・4・5 のストレートにも使えます。役は通常のポーカーにファイブカードを加えた順で判定し、同じ役はランクで比較します。スートの強弱はありません。</p>
      </section>
      <section class="game-board" aria-label="ポーカーのテーブル">
        <p id="poker-status" class="game-status" role="status" aria-live="polite"></p>
        <div class="hand-area">
          <h2>CPU <span id="cpu-role"></span></h2>
          <div id="cpu-hand" class="game-hand"></div>
        </div>
        <div class="hand-area">
          <h2>あなた <span id="player-role"></span></h2>
          <div id="player-hand" class="game-hand"></div>
          <p id="exchange-count" class="game-hint"></p>
        </div>
        <div class="game-actions">
          <button id="poker-deal" type="button">カードを配る</button>
          <button id="poker-exchange" type="button" hidden>選んだカードを交換して勝負</button>
        </div>
      </section>
    </main>
    <script src="./js/data.js"></script>
    <script src="./js/game-rules.js"></script>
    <script src="./js/poker.js"></script>
  </body>
</html>
