<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="タロット占いとカードゲーム">
    <title>Tarot Reading</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">A quiet moment for yourself</p>
        <h1>Tarot Reading</h1>
        <p id="instruction" class="instruction" aria-live="polite">
          スプレッドを選んでください
        </p>
      </header>

      <section id="spread-selector" class="spread-selector" aria-labelledby="spread-heading">
        <h2 id="spread-heading">スプレッドを選ぶ</h2>
        <label class="deck-option">
          <input id="use-minor" type="checkbox" checked>
          スリーカード・二者択一に小アルカナを含める
        </label>
        <div id="spread-list" class="spread-list"></div>
      </section>
      <section class="game-selector" aria-labelledby="game-heading">
        <h2 id="game-heading">カードゲーム</h2>
        <p>占いとは別に、小アルカナで遊べます。</p>
        <div class="game-links">
          <a href="./poker.html"><strong>1対1 ポーカー</strong><span>大アルカナ2枚をジョーカーにしてCPUと勝負</span></a>
          <a href="./blackjack.html"><strong>ブラックジャック</strong><span>小アルカナで21を目指す</span></a>
        </div>
      </section>

      <section
        id="reading-stage"
        class="reading-stage is-hidden"
        aria-label="カードを広げる場所"
      >
        <div id="table" class="table"></div>
        <button id="stage-action" class="stage-action is-hidden" type="button"></button>
      </section>

      <section id="reading-panel" class="reading-panel is-hidden" aria-live="polite">
        <p id="position-name" class="position-name"></p>
        <h2 id="card-name"></h2>
        <p id="orientation" class="orientation"></p>
        <div class="meaning-grid">
          <article>
            <h3>カードの意味</h3>
            <p id="card-meaning"></p>
          </article>
          <article>
            <h3>配置の意味</h3>
            <p id="position-meaning"></p>
          </article>
        </div>
        <section id="minor-supplement" class="minor-supplement is-hidden" aria-labelledby="minor-supplement-heading">
          <h3 id="minor-supplement-heading">小アルカナの補足</h3>
          <div class="minor-supplement-grid">
            <div>
              <h4 id="suit-heading"></h4>
              <p id="suit-meaning"></p>
            </div>
            <div>
              <h4 id="rank-heading"></h4>
              <p id="rank-meaning"></p>
            </div>
          </div>
        </section>
      </section>
      <footer class="site-footer">
        <a href="./credits.html">画像の出典・利用条件</a>
      </footer>
    </main>

    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
